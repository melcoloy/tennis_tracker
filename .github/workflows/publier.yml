name: Publier le tracker

# Pourquoi pas de reconstruction ici : Tennis Abstract renvoie 403 aux
# adresses des centres de donnees. Les pages ne peuvent etre telechargees
# que depuis une machine personnelle. Le site est donc construit en local
# (python publier.py) et pousse dans le depot ; cette Action se contente
# de le mettre en ligne.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/publier.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  deployer:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      # Sans ce controle, un site/ absent ou tronque remplacerait le
      # site en ligne par une page blanche, sans la moindre erreur.
      - name: Verifier le site avant mise en ligne
        run: |
          test -f site/index.html || { echo "::error::site/index.html manquant"; exit 1; }
          test -f site/donnees/index.json || { echo "::error::index des donnees manquant"; exit 1; }
          n=$(ls site/donnees/*.json | wc -l)
          echo "$n fichiers de donnees"
          [ "$n" -ge 2 ] || { echo "::error::trop peu de joueurs ($n)"; exit 1; }
          echo "Genere le : $(python -c "import json;print(json.load(open('site/donnees/index.json'))['genere_le'])")"

      - name: Preparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4